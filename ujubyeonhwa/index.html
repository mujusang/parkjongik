<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우주변화의 원리 — 전권 정리</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="한동석 『우주변화의 원리』 전권 정리 — 열람 비밀번호가 필요한 페이지입니다.">
<meta name="theme-color" content="#6b3f27">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 85% at 50% 0%,#fdfaf3 0%,#fbf8f2 45%,#f3ece0 100%);
    color:#23201c;
    font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",serif;
    line-height:1.7;
  }
  .lock{
    width:100%;max-width:356px;
    opacity:0;visibility:hidden;transition:opacity .26s ease;
  }
  .lock.ready{opacity:1;visibility:visible}
  .card{
    background:#fffdf8;border:1px solid #e3dccd;border-radius:18px;
    padding:34px 26px 22px;text-align:center;
    box-shadow:0 1px 2px rgba(60,40,20,.06),0 12px 34px rgba(60,40,20,.08);
  }
  .card.shake{animation:shk .34s ease}
  @keyframes shk{
    0%,100%{transform:translateX(0)}
    18%{transform:translateX(-6px)}
    38%{transform:translateX(5px)}
    58%{transform:translateX(-4px)}
    78%{transform:translateX(3px)}
  }
  .seal{
    width:48px;height:48px;margin:0 auto 16px;border-radius:13px;
    background:linear-gradient(145deg,#8a4a2b,#6b3f27 55%,#52301c);
    color:#fbf3e6;display:flex;align-items:center;justify-content:center;
    font-size:25px;line-height:1;box-shadow:0 4px 12px rgba(107,63,39,.22);
  }
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  .sub{
    margin:7px 0 26px;font-size:12px;color:#9a8d78;letter-spacing:.12em;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  form{margin:0}
  input[type="password"]{
    width:100%;height:50px;padding:0 14px;display:block;
    border:1px solid #e3dccd;border-radius:11px;background:#fbf8f2;color:#23201c;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:19px;letter-spacing:.42em;text-align:center;text-indent:.42em;
    outline:none;-webkit-appearance:none;appearance:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  input[type="password"]:focus{border-color:#c9ab8e;background:#fffdf8;box-shadow:0 0 0 3px #f0e4d6}
  input[type="password"]::placeholder{
    color:#bfb3a0;letter-spacing:.06em;text-indent:0;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  button.open{
    width:100%;height:50px;margin-top:11px;border:none;border-radius:11px;
    background:linear-gradient(145deg,#8a4a2b,#6b3f27);color:#fdf8f0;
    font-family:inherit;font-size:16px;letter-spacing:.06em;cursor:pointer;
    transition:filter .15s,opacity .15s;
    -webkit-appearance:none;appearance:none;
  }
  button.open:hover{filter:brightness(1.06)}
  button.open:disabled{opacity:.62;cursor:default}
  .msg{
    min-height:21px;margin:12px 0 0;font-size:13px;color:#a8422c;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  .msg.ok{color:#4b7a52}
  .note{
    margin:16px 0 0;font-size:11.5px;color:#a4967f;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  .foot{
    margin:20px 0 0;text-align:center;font-size:11.5px;color:#b0a48f;letter-spacing:.04em;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
</style>
</head>
<body>
  <div class="lock" id="lock">
    <div class="card" id="card">
      <div class="seal">易</div>
      <h1>우주변화의 원리</h1>
      <p class="sub">전권 정리 · 열람 비밀번호</p>
      <form id="form" autocomplete="off">
        <input id="pw" type="password" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="비밀번호를 입력하세요" aria-label="비밀번호">
        <button class="open" id="open" type="submit">열기</button>
      </form>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <p class="note">한 번 열어 두면 이 기기에서는 다시 묻지 않습니다.</p>
    </div>
    <p class="foot">한동석 『우주변화의 원리』 스캔 472면 전권 정리</p>
  </div>

<script src="book.enc.js"></script>
<script>
(function(){
  "use strict";

  var CFG   = window.__BOOK_LOCK || null;
  var LSKEY = "ujubyeonhwa.lock.v1";

  var lock    = document.getElementById("lock");
  var card    = document.getElementById("card");
  var form    = document.getElementById("form");
  var pwInput = document.getElementById("pw");
  var btnOpen = document.getElementById("open");
  var msg     = document.getElementById("msg");

  function b64ToBytes(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes){
    var bin = "", chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function enc(str){ return new TextEncoder().encode(str); }

  function subtleAvailable(){
    return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.decrypt && window.isSecureContext !== false);
  }

  async function decryptWithKey(key){
    var plain = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(CFG.iv), additionalData: enc(CFG.aad), tagLength: 128 },
      key,
      b64ToBytes(CFG.ct)
    );
    return new TextDecoder("utf-8").decode(plain);
  }

  async function deriveKey(password){
    var ctor = window.crypto.subtle;
    var base = await ctor.importKey("raw", enc(password), "PBKDF2", false, ["deriveKey"]);
    return await ctor.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(CFG.salt), iterations: CFG.iter, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      true,
      ["decrypt"]
    );
  }

  function loadStoredKey(){
    try {
      var raw = localStorage.getItem(LSKEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || obj.v !== CFG.v || !obj.k) return null;
      return b64ToBytes(obj.k);
    } catch (e){ return null; }
  }
  function storeKey(bytes){
    try { localStorage.setItem(LSKEY, JSON.stringify({ v: CFG.v, k: bytesToB64(bytes), t: Date.now() })); } catch (e){}
  }
  function clearStoredKey(){
    try { localStorage.removeItem(LSKEY); } catch (e){}
  }

  /* 복호화한 문서를 그대로 문서로 열고, 발밑에 조용한 잠금 단추만 하나 붙인다. */
  function mount(html){
    var extraStyle =
      "<style id=\"pk-lock-style\">" +
        "#pk-lock{display:inline-flex;align-items:center;gap:4px;margin-top:2px;padding:5px 11px;" +
        "border:1px solid #e0d6c4;border-radius:999px;background:#fffdf8;color:#8a7355;" +
        "font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;" +
        "font-size:11.5px;letter-spacing:.02em;line-height:1.5;cursor:pointer;opacity:.75;" +
        "transition:opacity .15s,color .15s,border-color .15s;-webkit-appearance:none;}" +
        "#pk-lock:hover,#pk-lock:focus{opacity:1;color:#6b3f27;border-color:#cbb99f;outline:none;}" +
        "@media print{#pk-lock{display:none !important;}}" +
      "</style>";
    var extraLock =
      "<p style=\"margin:14px 0 0;text-align:center\" class=\"no-print\">" +
        "<button type=\"button\" id=\"pk-lock\" title=\"이 기기에서 잠금을 풀어 둔 기억을 지웁니다\"" +
        " onclick=\"try{localStorage.removeItem('" + LSKEY + "')}catch(e){};location.reload();\">🔒 잠그기</button>" +
      "</p>";

    var out = html;
    var fi = out.lastIndexOf("</footer>");
    if (fi !== -1) out = out.slice(0, fi) + extraLock + out.slice(fi);
    var bi = out.lastIndexOf("</body>");
    if (bi !== -1) out = out.slice(0, bi) + extraStyle + out.slice(bi);
    else out += extraStyle;

    document.open();
    document.write(out);
    document.close();

    try {
      var mt = out.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      if (mt && mt[1].trim()) document.title = mt[1].trim();
    } catch (e){}
  }

  function showLock(){
    lock.classList.add("ready");
    try { pwInput.focus({ preventScroll: true }); } catch (e) { try { pwInput.focus(); } catch (e2){} }
  }

  function fail(text){
    msg.textContent = text;
    msg.classList.remove("ok");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    try { pwInput.select(); } catch (e){}
  }

  async function tryAutoUnlock(){
    var raw = loadStoredKey();
    if (!raw) return false;
    try {
      var key = await window.crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      var html = await decryptWithKey(key);
      mount(html);
      return true;
    } catch (e){
      clearStoredKey();
      return false;
    }
  }

  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    if (btnOpen.disabled) return;

    var pw = pwInput.value;
    if (!pw){ fail("비밀번호를 입력해 주세요."); return; }

    btnOpen.disabled = true;
    btnOpen.textContent = "확인 중…";
    msg.textContent = "";
    msg.classList.remove("ok");

    try {
      var key = await deriveKey(pw);
      var html = await decryptWithKey(key);
      try {
        var exported = await window.crypto.subtle.exportKey("raw", key);
        storeKey(new Uint8Array(exported));
      } catch (e){}
      mount(html);
    } catch (e){
      if (e && (e.name === "OperationError" || e.name === "DataError")){
        fail("비밀번호가 맞지 않습니다. 다시 확인해 주세요.");
      } else {
        fail("열지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
      }
      btnOpen.disabled = false;
      btnOpen.textContent = "열기";
    }
  });

  (async function boot(){
    if (!CFG){
      showLock();
      btnOpen.disabled = true;
      msg.textContent = "자료를 불러오지 못했습니다. 새로고침해 주세요.";
      return;
    }
    if (!subtleAvailable()){
      showLock();
      btnOpen.disabled = true;
      msg.textContent = "이 브라우저에서는 암호 해제를 지원하지 않습니다. 최신 브라우저로 열어 주세요.";
      return;
    }
    if (await tryAutoUnlock()) return;
    showLock();
  })();
})();
</script>
</body>
</html>
